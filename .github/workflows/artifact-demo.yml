name: The Time Capsule

on: [workflow_dispatch] # Manual trigger button

jobs:
  generate-report:
    runs-on: ubuntu-latest
    
    steps:
      - name: Create the Secret File
        run: |
          echo "REPORT GENERATED ON $(date)" > secret_report.txt
          echo "Status: Success" >> secret_report.txt
          echo "Agent: GitHub Actions Bot" >> secret_report.txt
          ls -la # Verify it exists

      - name: Upload the Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mission-report
          path: secret_report.txt
          retention-days: 5 # Keeps it for 5 days
